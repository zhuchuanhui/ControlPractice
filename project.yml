name: ControlPractice
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "$(APP_VERSION)"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    DEVELOPMENT_TEAM: P5AXR6XT8D
    CODE_SIGN_STYLE: Automatic
targets:
  ControlPractice:
    type: application
    platform: macOS
    sources:
      - path: Sources/ControlPractice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.controlpractice.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(APP_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(BUILD_NUMBER)"
        INFOPLIST_KEY_CFBundleDisplayName: "Control Practice"
        INFOPLIST_KEY_CFBundleLocalizations: "ja en zh-Hans zh-Hant"
        INFOPLIST_FILE: AppInfo.plist
        PRODUCT_NAME: ControlPractice
    scheme:
      testTargets: []
  ControlPracticePhone:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
      - path: Sources/ControlPractice/LanguageSettings.swift
      - path: Sources/ControlPractice/Localized.swift
      - path: MotionSample.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.controlpractice.iphone
        INFOPLIST_KEY_CFBundleShortVersionString: "$(APP_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(BUILD_NUMBER)"
        INFOPLIST_KEY_CFBundleDisplayName: "Control Practice"
        DEVELOPMENT_TEAM: P5AXR6XT8D
        INFOPLIST_KEY_CFBundleDisplayName: Control Practice
        INFOPLIST_KEY_CFBundleLocalizations: "ja en zh-Hans zh-Hant"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Macアプリへ計測データを送信するためにローカルネットワークを使用します。"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    info:
      path: iOSApp/Info.plist
    dependencies:
      - target: ControlPracticeWatch
        embed: true
    scheme:
      testTargets: []
  ControlPracticeWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Sources/ControlPractice/LanguageSettings.swift
      - path: Sources/ControlPractice/Localized.swift
      - path: MotionSample.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.controlpractice.iphone.watchkitapp
        INFOPLIST_KEY_CFBundleShortVersionString: "$(APP_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(BUILD_NUMBER)"
        INFOPLIST_KEY_CFBundleDisplayName: "Control Practice"
        DEVELOPMENT_TEAM: P5AXR6XT8D
        INFOPLIST_KEY_CFBundleLocalizations: "ja en zh-Hans zh-Hant"
        INFOPLIST_KEY_NSMotionUsageDescription: "手首の動きを計測するためにモーションセンサーを使用します。"
    info:
      path: WatchApp/AppInfo.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.controlpractice.iphone
    scheme:
      testTargets: []
